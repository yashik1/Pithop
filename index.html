<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find fun stops, hidden gems and breaks along your driving route." />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://pithop.com/" />
    <!-- Rich link previews on WhatsApp, Discord, iMessage, X, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pithop" />
    <meta property="og:title" content="Pithop — fun stops on long drives" />
    <meta
      property="og:description"
      content="Type where you're driving from and to — Pithop finds viewpoints, quirky attractions, food and hidden gems along the way, then navigates you there. Free, in your browser."
    />
    <meta property="og:url" content="https://pithop.com/" />
    <meta property="og:image" content="https://pithop.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pithop — fun stops on long drives" />
    <meta
      name="twitter:description"
      content="Type where you're driving from and to — Pithop finds the stops worth pulling over for. Free, in your browser."
    />
    <meta name="twitter:image" content="https://pithop.com/og.png" />
    <title>Pithop — fun stops on long drives</title>
    <script>
      // Apply the stored theme + language direction before first paint.
      try {
        var m = localStorage.getItem('sq-theme');
        var dark =
          m === 'dark' || ((m === null || m === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var lang = localStorage.getItem('sq-lang') || (navigator.language || 'en').slice(0, 2);
        var rtl = ['ar', 'he', 'fa', 'ur'];
        if (rtl.indexOf(lang) !== -1) document.documentElement.dir = 'rtl';
      } catch (e) {}
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #f2f5fa;
      }
      :root[data-theme='dark'],
      :root[data-theme='dark'] body,
      :root[data-theme='dark'] #root {
        background: #0f1826;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
